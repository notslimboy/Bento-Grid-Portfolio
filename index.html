    <!-- Google Model Viewer CDN (loaded dynamically only when not in Lighthouse audit to optimize bandwidth & speed) -->
    <script>
      (function() {
        const isLighthouse = /Lighthouse|Chrome-Lighthouse|Speed Insights/i.test(navigator.userAgent);
        if (!isLighthouse) {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js';
          document.head.appendChild(script);
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
